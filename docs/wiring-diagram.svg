<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Dead Card Detector — Wiring Diagram</text>

  <!-- Arduino Uno + Ethernet Shield board -->
  <rect x="60" y="80" width="300" height="380" rx="14" fill="#1f6f43" stroke="#123f26" stroke-width="2"/>
  <text x="210" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Arduino Uno R3</text>
  <text x="210" y="130" text-anchor="middle" font-size="13" fill="#e6f4ea">+ Ethernet Shield (W5100)</text>

  <!-- RJ45 port -->
  <rect x="150" y="150" width="120" height="36" rx="4" fill="#333333" stroke="#111111" stroke-width="1.5"/>
  <text x="210" y="173" text-anchor="middle" font-size="12" fill="#ffffff">RJ45 Ethernet</text>

  <!-- Pin pads on right edge of board -->
  <circle cx="360" cy="230" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="226" text-anchor="end" font-size="13" fill="#ffffff">Pin 6</text>

  <circle cx="360" cy="280" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="276" text-anchor="end" font-size="13" fill="#ffffff">Pin 7</text>

  <circle cx="360" cy="330" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="326" text-anchor="end" font-size="13" fill="#ffffff">Pin 8</text>

  <circle cx="360" cy="380" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="376" text-anchor="end" font-size="13" fill="#ffffff">Pin 9</text>

  <circle cx="360" cy="430" r="6" fill="#c9c9c9" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="345" y="426" text-anchor="end" font-size="13" fill="#ffffff">GND</text>

  <!-- Ethernet cable to reader -->
  <line x1="270" y1="168" x2="620" y2="168" stroke="#333333" stroke-width="3"/>
  <text x="445" y="155" text-anchor="middle" font-size="12" fill="#333333">Ethernet Cable</text>

  <!-- RFID Reader box -->
  <rect x="620" y="120" width="220" height="100" rx="10" fill="#2b5fa8" stroke="#173a68" stroke-width="2"/>
  <text x="730" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">RFID Reader</text>
  <text x="730" y="180" text-anchor="middle" font-size="12" fill="#dce8f7">(TCP server, RS232→Ethernet)</text>
  <text x="730" y="200" text-anchor="middle" font-size="12" fill="#dce8f7">Contactless card placed here</text>

  <!-- ===== Status LED branch (Pin 6) ===== -->
  <line x1="360" y1="230" x2="470" y2="230" stroke="#333333" stroke-width="2"/>
  <!-- resistor -->
  <rect x="470" y="220" width="50" height="20" fill="#e8d9b0" stroke="#7a5c1e" stroke-width="1.5"/>
  <text x="495" y="215" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="520" y1="230" x2="560" y2="230" stroke="#333333" stroke-width="2"/>
  <!-- LED -->
  <circle cx="580" cy="230" r="18" fill="#ffdd55" stroke="#8a6d00" stroke-width="2"/>
  <text x="580" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a4400">LED</text>
  <text x="580" y="205" text-anchor="middle" font-size="12" fill="#1a1a1a">Status</text>
  <line x1="598" y1="230" x2="630" y2="230" stroke="#333333" stroke-width="2"/>
  <line x1="630" y1="230" x2="630" y2="470" stroke="#333333" stroke-width="2"/>

  <!-- ===== Card Found LED branch (Pin 8) ===== -->
  <line x1="360" y1="330" x2="470" y2="330" stroke="#333333" stroke-width="2"/>
  <rect x="470" y="320" width="50" height="20" fill="#c7f0c2" stroke="#2c7a2c" stroke-width="1.5"/>
  <text x="495" y="315" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="520" y1="330" x2="560" y2="330" stroke="#333333" stroke-width="2"/>
  <circle cx="580" cy="330" r="18" fill="#5fd35f" stroke="#1f6b1f" stroke-width="2"/>
  <text x="580" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#0e3a0e">LED</text>
  <text x="580" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a">Card Found</text>
  <line x1="598" y1="330" x2="630" y2="330" stroke="#333333" stroke-width="2"/>
  <line x1="630" y1="330" x2="630" y2="470" stroke="#333333" stroke-width="2"/>

  <!-- ===== No Card LED branch (Pin 9) ===== -->
  <line x1="360" y1="380" x2="470" y2="380" stroke="#333333" stroke-width="2"/>
  <rect x="470" y="370" width="50" height="20" fill="#f5c6c6" stroke="#8a2222" stroke-width="1.5"/>
  <text x="495" y="365" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="520" y1="380" x2="560" y2="380" stroke="#333333" stroke-width="2"/>
  <circle cx="580" cy="380" r="18" fill="#e05a5a" stroke="#7a1f1f" stroke-width="2"/>
  <text x="580" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a0e0e">LED</text>
  <text x="580" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">No Card</text>
  <line x1="598" y1="380" x2="630" y2="380" stroke="#333333" stroke-width="2"/>
  <line x1="630" y1="380" x2="630" y2="470" stroke="#333333" stroke-width="2"/>

  <!-- Common GND rail for LEDs -->
  <line x1="630" y1="470" x2="360" y2="470" stroke="#333333" stroke-width="2"/>
  <line x1="360" y1="470" x2="360" y2="430" stroke="#333333" stroke-width="2"/>
  <text x="495" y="490" text-anchor="middle" font-size="12" fill="#1a1a1a">common GND rail</text>

  <!-- ===== Push Button branch (Pin 7) ===== -->
  <line x1="360" y1="280" x2="470" y2="280" stroke="#333333" stroke-width="2"/>
  <rect x="470" y="260" width="70" height="40" rx="4" fill="#d8d8d8" stroke="#555555" stroke-width="1.5"/>
  <line x1="480" y1="280" x2="500" y2="270" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="270" x2="520" y2="280" stroke="#333333" stroke-width="2"/>
  <text x="505" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">Push Button</text>
  <line x1="540" y1="280" x2="630" y2="280" stroke="#333333" stroke-width="2"/>
  <line x1="630" y1="280" x2="630" y2="470" stroke="#333333" stroke-width="2"/>

  <!-- Legend -->
  <rect x="60" y="520" width="780" height="80" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1"/>
  <text x="80" y="545" font-size="12" fill="#1a1a1a" font-weight="bold">Notes:</text>
  <text x="80" y="565" font-size="12" fill="#1a1a1a">• Pin 7 uses the Arduino's internal pull-up (INPUT_PULLUP) — the button only needs a wire to GND, no external resistor.</text>
  <text x="80" y="583" font-size="12" fill="#1a1a1a">• Each LED's cathode (short leg) faces GND; the anode (long leg) faces its resistor. All three LEDs share one GND rail.</text>
</svg>
