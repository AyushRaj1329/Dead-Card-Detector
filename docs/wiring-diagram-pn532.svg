<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 810" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="940" height="810" fill="#ffffff"/>

  <!-- Title -->
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Dead Card Detector — Wiring Diagram (PN532 / SPI)</text>
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#666666">ats_only_reader.ino — Arduino Uno R3 + PN532 NFC module</text>

  <!-- ===== Arduino Uno board ===== -->
  <rect x="60" y="100" width="300" height="580" rx="14" fill="#1f6f43" stroke="#123f26" stroke-width="2"/>
  <text x="210" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Arduino Uno R3</text>
  <text x="210" y="152" text-anchor="middle" font-size="12" fill="#e6f4ea">ATmega328P</text>

  <!-- SPI group header -->
  <text x="210" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#b9e2c8">— hardware SPI → PN532 —</text>

  <!-- SPI pin pads (right edge) -->
  <circle cx="360" cy="195" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="199" text-anchor="end" font-size="13" fill="#ffffff">Pin 13</text>

  <circle cx="360" cy="222" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="226" text-anchor="end" font-size="13" fill="#ffffff">Pin 12</text>

  <circle cx="360" cy="249" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="253" text-anchor="end" font-size="13" fill="#ffffff">Pin 11</text>

  <circle cx="360" cy="276" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="280" text-anchor="end" font-size="13" fill="#ffffff">Pin 10</text>

  <circle cx="360" cy="303" r="6" fill="#ff8a80" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="345" y="307" text-anchor="end" font-size="13" fill="#ffffff">5V</text>

  <circle cx="360" cy="330" r="6" fill="#c9c9c9" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="345" y="334" text-anchor="end" font-size="13" fill="#ffffff">GND</text>

  <!-- I/O group header -->
  <text x="210" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#b9e2c8">— button &amp; result outputs —</text>

  <!-- I/O pin pads (right edge) -->
  <circle cx="360" cy="440" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="444" text-anchor="end" font-size="13" fill="#ffffff">Pin 6</text>

  <circle cx="360" cy="500" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="504" text-anchor="end" font-size="13" fill="#ffffff">Pin 7</text>

  <circle cx="360" cy="560" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="564" text-anchor="end" font-size="13" fill="#ffffff">Pin 8</text>

  <circle cx="360" cy="615" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="345" y="619" text-anchor="end" font-size="13" fill="#ffffff">Pin 9</text>

  <circle cx="360" cy="660" r="6" fill="#c9c9c9" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="345" y="664" text-anchor="end" font-size="13" fill="#ffffff">GND</text>

  <!-- ===== PN532 module ===== -->
  <rect x="640" y="120" width="250" height="240" rx="10" fill="#2b5fa8" stroke="#173a68" stroke-width="2"/>
  <text x="765" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">PN532 NFC Module</text>
  <text x="765" y="167" text-anchor="middle" font-size="11" fill="#dce8f7">SEL0 = 0, SEL1 = 1  (SPI mode)</text>

  <!-- PN532 pin pads (left edge) -->
  <circle cx="640" cy="195" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="656" y="199" text-anchor="start" font-size="13" fill="#ffffff">SCK</text>

  <circle cx="640" cy="222" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="656" y="226" text-anchor="start" font-size="13" fill="#ffffff">MISO</text>

  <circle cx="640" cy="249" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="656" y="253" text-anchor="start" font-size="13" fill="#ffffff">MOSI</text>

  <circle cx="640" cy="276" r="6" fill="#ffd54a" stroke="#5a4a00" stroke-width="1.5"/>
  <text x="656" y="280" text-anchor="start" font-size="13" fill="#ffffff">SS (NSS / CS)</text>

  <circle cx="640" cy="303" r="6" fill="#ff8a80" stroke="#7a1f1f" stroke-width="1.5"/>
  <text x="656" y="307" text-anchor="start" font-size="13" fill="#ffffff">VCC</text>

  <circle cx="640" cy="330" r="6" fill="#c9c9c9" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="656" y="334" text-anchor="start" font-size="13" fill="#ffffff">GND</text>

  <!-- ===== SPI bus wires ===== -->
  <line x1="360" y1="195" x2="640" y2="195" stroke="#e08a2e" stroke-width="2.5"/>
  <text x="500" y="189" text-anchor="middle" font-size="11" fill="#8a5210">SCK (clock)</text>

  <line x1="360" y1="222" x2="640" y2="222" stroke="#2b6fd6" stroke-width="2.5"/>
  <text x="500" y="216" text-anchor="middle" font-size="11" fill="#1a4a94">MISO (reader → Uno)</text>

  <line x1="360" y1="249" x2="640" y2="249" stroke="#2c9e4b" stroke-width="2.5"/>
  <text x="500" y="243" text-anchor="middle" font-size="11" fill="#1c6631">MOSI (Uno → reader)</text>

  <line x1="360" y1="276" x2="640" y2="276" stroke="#8a4bd6" stroke-width="2.5"/>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#5a2e94">SS / chip select</text>

  <line x1="360" y1="303" x2="640" y2="303" stroke="#d63b3b" stroke-width="2.5"/>
  <text x="500" y="297" text-anchor="middle" font-size="11" fill="#8a2222">5V power</text>

  <line x1="360" y1="330" x2="640" y2="330" stroke="#333333" stroke-width="2.5"/>
  <text x="500" y="324" text-anchor="middle" font-size="11" fill="#333333">GND (common)</text>

  <!-- ===== Card + RF field ===== -->
  <line x1="790" y1="360" x2="790" y2="392" stroke="#2b5fa8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="802" y="380" text-anchor="start" font-size="10" fill="#2b5fa8">13.56 MHz</text>

  <rect x="700" y="392" width="190" height="72" rx="8" fill="#f0f4fa" stroke="#2b5fa8" stroke-width="2"/>
  <text x="795" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a68">Contactless Card</text>
  <text x="795" y="440" text-anchor="middle" font-size="11" fill="#3a5a88">placed on module antenna</text>
  <text x="795" y="456" text-anchor="middle" font-size="10" fill="#6a7a94">present individually — no wallet</text>

  <!-- ===== Status LED branch (Pin 6) ===== -->
  <line x1="360" y1="440" x2="440" y2="440" stroke="#333333" stroke-width="2"/>
  <rect x="440" y="430" width="50" height="20" fill="#e8d9b0" stroke="#7a5c1e" stroke-width="1.5"/>
  <text x="465" y="425" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="490" y1="440" x2="530" y2="440" stroke="#333333" stroke-width="2"/>
  <circle cx="550" cy="440" r="18" fill="#ffdd55" stroke="#8a6d00" stroke-width="2"/>
  <text x="550" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a4400">LED</text>
  <text x="550" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Reader Ready</text>
  <line x1="568" y1="440" x2="620" y2="440" stroke="#333333" stroke-width="2"/>
  <line x1="620" y1="440" x2="620" y2="700" stroke="#333333" stroke-width="2"/>

  <!-- ===== Push Button branch (Pin 7) ===== -->
  <line x1="360" y1="500" x2="440" y2="500" stroke="#333333" stroke-width="2"/>
  <rect x="440" y="480" width="70" height="40" rx="4" fill="#d8d8d8" stroke="#555555" stroke-width="1.5"/>
  <line x1="450" y1="500" x2="470" y2="490" stroke="#333333" stroke-width="2"/>
  <line x1="470" y1="490" x2="490" y2="500" stroke="#333333" stroke-width="2"/>
  <text x="475" y="474" text-anchor="middle" font-size="12" fill="#1a1a1a">Trigger Button</text>
  <text x="475" y="536" text-anchor="middle" font-size="10" fill="#666666">hold = read, release = clear</text>
  <line x1="510" y1="500" x2="620" y2="500" stroke="#333333" stroke-width="2"/>

  <!-- ===== ATS Found LED branch (Pin 8) ===== -->
  <line x1="360" y1="560" x2="440" y2="560" stroke="#333333" stroke-width="2"/>
  <rect x="440" y="550" width="50" height="20" fill="#c7f0c2" stroke="#2c7a2c" stroke-width="1.5"/>
  <text x="465" y="545" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="490" y1="560" x2="530" y2="560" stroke="#333333" stroke-width="2"/>
  <circle cx="550" cy="560" r="18" fill="#5fd35f" stroke="#1f6b1f" stroke-width="2"/>
  <text x="550" y="564" text-anchor="middle" font-size="10" font-weight="bold" fill="#0e3a0e">LED</text>
  <text x="612" y="558" text-anchor="start" font-size="12" fill="#1a1a1a">ATS Found</text>
  <text x="612" y="572" text-anchor="start" font-size="10" fill="#666666">card answered RATS</text>
  <line x1="568" y1="560" x2="620" y2="560" stroke="#333333" stroke-width="2"/>

  <!-- ===== No ATS LED branch (Pin 9) ===== -->
  <line x1="360" y1="615" x2="440" y2="615" stroke="#333333" stroke-width="2"/>
  <rect x="440" y="605" width="50" height="20" fill="#f5c6c6" stroke="#8a2222" stroke-width="1.5"/>
  <text x="465" y="600" text-anchor="middle" font-size="11" fill="#333333">220Ω</text>
  <line x1="490" y1="615" x2="530" y2="615" stroke="#333333" stroke-width="2"/>
  <circle cx="550" cy="615" r="18" fill="#e05a5a" stroke="#7a1f1f" stroke-width="2"/>
  <text x="550" y="619" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a0e0e">LED</text>
  <text x="612" y="613" text-anchor="start" font-size="12" fill="#1a1a1a">No ATS</text>
  <text x="612" y="627" text-anchor="start" font-size="10" fill="#666666">no card, or no RATS reply</text>
  <line x1="568" y1="615" x2="620" y2="615" stroke="#333333" stroke-width="2"/>

  <!-- Common GND rail for LEDs + button -->
  <line x1="620" y1="700" x2="360" y2="700" stroke="#333333" stroke-width="2"/>
  <line x1="360" y1="700" x2="360" y2="660" stroke="#333333" stroke-width="2"/>
  <text x="490" y="718" text-anchor="middle" font-size="12" fill="#1a1a1a">common GND rail</text>

  <!-- ===== Notes ===== -->
  <rect x="60" y="735" width="830" height="62" rx="8" fill="#f6f6f6" stroke="#cccccc" stroke-width="1"/>
  <text x="76" y="752" font-size="11" fill="#1a1a1a" font-weight="bold">Notes:</text>
  <text x="76" y="768" font-size="11" fill="#1a1a1a">• PN532 must be in SPI mode (SEL0 = 0, SEL1 = 1). Most modules latch the mode at power-up — power-cycle after changing the switches.</text>
  <text x="76" y="783" font-size="11" fill="#1a1a1a">• Pins 11/12/13 are fixed by the Uno's hardware SPI; pin 10 is chip select (configurable via PN532_SS). Pin 7 uses INPUT_PULLUP — no external resistor.</text>
  <text x="76" y="793" font-size="10" fill="#666666">• LED anode (long leg) faces its 220Ω resistor; cathode (short leg) returns to the shared GND rail. Check your module's VCC rating — most accept 5V, some bare modules are 3.3V only.</text>
</svg>
